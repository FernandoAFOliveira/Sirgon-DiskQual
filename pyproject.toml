[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sirgon-diskqual"
version = "0.3.0b10"
description = "Drive qualification, reporting, and labeling station for Linux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "textual>=0.70",
  "reportlab>=4.0",
]

[project.scripts]
diskqual = "diskqual.launcher:main"
sirgon-diskqual = "diskqual.launcher:main"
sirgon-diskqual-ui = "diskqual.ui:main"

[tool.setuptools.packages.find]
include = ["diskqual*"]
