name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -lh dist/

      - name: Verify wheel package
        run: |
          python -m venv /tmp/sirgon-release-test
          /tmp/sirgon-release-test/bin/python -m pip install --upgrade pip
          /tmp/sirgon-release-test/bin/python -m pip install dist/*.whl
          /tmp/sirgon-release-test/bin/diskqual --version
          /tmp/sirgon-release-test/bin/python -c "import diskqual, diskqual.tui, diskqual.operator_ui, diskqual.engine, diskqual.workflow, diskqual.station, diskqual.smart_observe, diskqual.reconcile, diskqual.surface, diskqual.qualification_policy, diskqual.locate, diskqual.status, diskqual.reporting, diskqual.labels, diskqual.keep_awake; print('Package imports OK')"

      - name: Prepare versioned Linux installer asset
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          INSTALLER="sirgon-diskqual-installer-${TAG}.sh"
          sed "s/^REQUESTED_TAG=\"\"$/REQUESTED_TAG=\"$TAG\"/" install.sh > "$INSTALLER"
          cat installer-operator.sh >> "$INSTALLER"
          chmod +x "$INSTALLER"
          grep '^REQUESTED_TAG=' "$INSTALLER" | head -1
          echo "INSTALLER=$INSTALLER" >> "$GITHUB_ENV"
          ls -lh "$INSTALLER"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          FLAGS=()
          case "$TAG" in
            *-alpha*|*-beta*|*-rc*) FLAGS+=(--prerelease) ;;
          esac

          gh release create "$TAG" \
            "$INSTALLER" \
            dist/*.whl \
            --title "Sirgon DiskQual ${TAG#v}" \
            --generate-notes \
            "${FLAGS[@]}"
